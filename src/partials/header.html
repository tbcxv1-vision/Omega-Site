<header class="site-header" data-header>
  <div class="container header-inner">
    <a class="logo" href="index.html" aria-label="{{company}} — home">{{> logo}}</a>

    <nav class="nav-desktop" aria-label="Primary">
      <a href="services.html" {{active_services}}>Services</a>
      <a href="training.html" {{active_training}}>Training</a>
      <a href="fellowship.html" {{active_fellowship}}>Fellowship</a>
      <a href="about.html" {{active_about}}>About</a>
      <a href="contact.html" {{active_contact}}>Contact</a>
    </nav>

    <div class="header-actions">
      <a class="btn btn-primary btn-sm header-cta" href="contact.html">Get Started</a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="mobile-nav" aria-label="Open menu" data-menu-toggle>
        <span class="menu-icon-open">{{icon:Menu}}</span>
        <span class="menu-icon-close">{{icon:X}}</span>
      </button>
    </div>
  </div>

  <nav class="nav-mobile" id="mobile-nav" aria-label="Mobile" hidden data-mobile-nav>
    <div class="container">
      <a href="index.html" {{active_home}}>Home</a>
      <a href="services.html" {{active_services}}>Services</a>
      <a href="training.html" {{active_training}}>Training</a>
      <a href="fellowship.html" {{active_fellowship}}>Fellowship</a>
      <a href="about.html" {{active_about}}>About</a>
      <a href="contact.html" {{active_contact}}>Contact</a>
      <a class="btn btn-primary" href="contact.html">Get Started {{icon:ArrowRight}}</a>
    </div>
  </nav>
</header>
