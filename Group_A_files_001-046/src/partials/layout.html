<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  {{baseTag}}
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonical}}">
  <meta name="theme-color" content="#04060d">
  <meta name="color-scheme" content="dark">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{company}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{siteUrl}}/assets/img/og-image.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>document.documentElement.classList.add('js');</script>
  <script src="assets/js/main.js" defer></script>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ProfessionalService",
    "name": "{{company}}",
    "url": "{{siteUrl}}",
    "email": "{{email}}",
    "telephone": "{{phone}}",
    "description": "Managed cybersecurity, IT infrastructure, cloud, custom software, security awareness training and the Omega STEM Fellowship.",
    "areaServed": "US",
    "logo": "{{siteUrl}}/assets/img/favicon.svg"
  }
  </script>
</head>
<body data-page="{{page}}">
  <a class="skip-link" href="#main">Skip to main content</a>
  {{> header}}
  <main id="main" tabindex="-1">
{{content}}
  </main>
  {{> footer}}
</body>
</html>
